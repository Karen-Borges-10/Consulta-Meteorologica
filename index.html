<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-thin-straight/css/uicons-thin-straight.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-straight/css/uicons-regular-straight.css">
    <title> CONSULTA METEOLÓGICA</title>
</head>
<body>
    <header>
        <h1>⛅ Clima Agora</h1>
        <p>★ Cidades favoritas</p>
    </header>
    <main>
        <div id="area_busca">
            <form id="buscar_cidade">
                <input type="text" id="cidade" placeholder="Digite o nome de uma cidade..." required>
                <button type="submit" id="buscar">Buscar</button>
            </form>
            <section id="selecao_localidade">
                <p id="mensagem" role="status"></p>

                <div id="locais" hidden>
                    <ul id="resultado"></ul>
                </div>
            </section>
        </div>

        <section id="clima_atual">

            <div class="topo_clima">
                <div class="local_clima">
                    <i class="fi fi-rs-marker"></i>
                    <h3 id="nome_local_clima"></h3>
                    <button id="favoritar" type="button">☆</button>
                </div>

                <p id="data_clima"></p>
            </div>

            <div class="resumo_clima">
                <div id="icone_condicao"></div>

                <div class="temperatura_clima">
                    <h2 id="temperatura_atual"></h2>
                    <p id="descricao_atual"></p>
                </div>
            </div>

            <div class="detalhes_clima">

                <div class="detalhe_clima">
                    <i class="fi fi-rr-wind"></i>
                    <div>
                        <p>Vento</p>
                        <span id="vento_atual"></span>
                    </div>
                </div>

                <div class="detalhe_clima">
                    <i class="fi fi-ts-temperature-high"></i>
                    <div>
                        <p>Sensação térmica</p>
                        <span id="sensacao_atual"></span>
                    </div>
                </div>

                <div class="detalhe_clima">
                    <i class="fi fi-rs-dewpoint"></i>
                    <div>
                        <p>Umidade</p>
                        <span id="umidade_atual"></span>
                    </div>
                </div>

            </div>

        </section>

        <section id="cidades_favoritas">
            <h3>Cidades favoritas</h3>
        </section>

        <section id="proximos_dias">
            <h3>Previsão para os próximos dias</h3>
        </section>
    </main>
</body>
</html>
